<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペニーマップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}

.info {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: white;
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
}

.legend {
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 1000;
  background: white;
  padding: 8px;
  border-radius: 10px;
  font-size: 12px;
} 

#menuPanel {
  display: none;
}

#legendBox {
  display: none;
}

.menu-btn,
.legend-btn,
.pin-btn,
.location-btn,
.road-btn,
.finish-btn,
.delete-btn {
  width: 50px;
  height: 50px;

  background: white;
  border: none;
  border-radius: 50%;

  font-size: 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 2px 8px rgba(0,0,0,0.2);

  z-index: 1000;
}

.menu-btn {
  position: fixed;
  right: 15px;
  top: 70px;
}

.legend-btn {
  position: fixed;
  right: 15px;
  top: 130px;
}

.pin-btn {
  position: fixed;
  right: 15px;
  bottom: 20px;
}

.location-btn {
  position: fixed;
  right: 15px;
  bottom: 80px;
}

.road-btn {
  position: fixed;
  right: 15px;
  bottom: 140px;
}

.finish-btn {
  position: fixed;
  right: 15px;
  bottom: 200px;
}

.active-mode {
  background: #4CAF50 !important;
}

.popup-box{
  min-width: 120px;
}

.popup-content{
  margin-bottom: 12px;
}

.popup-actions{
  text-align: right;
}

.delete-marker-btn,
.delete-road-btn{
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="info">
🛹 ペニーマップ<br>
地図をタップして路面情報を登録
</div>

<div id="map"></div>

<button class="menu-btn" onclick="toggleMenu()">
☰
</button>

<button class="legend-btn" onclick="toggleLegend()">
🌈
</button>

<div id="menuPanel">

<button class="location-btn" onclick="goToLocation()">📍</button>

<button class="road-btn" onclick="toggleRoadMode()">🛣️</button>

<button class="finish-btn" onclick="finishRoad()">✅</button>

<button class="pin-btn" onclick="togglePinMode()">📌</button>

</div>

<div class="legend" id="legendBox">  
🟢 ★★★★★ 快適<br>
🔵 ★★★★☆ 良好<br>
🟡 ★★★☆☆ 普通<br>
🟠 ★★☆☆☆ 荒れ気味<br>
🔴 ★☆☆☆☆ 厳しい
</div>
  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([31.9111,131.4239], 13);

let pinMode = true;
let roadMode = false;
let menuVisible = false;
let legendVisible = false;

window.onload = function(){
updateModeButtons();
}

let roadPoints = [];
let tempLine = null;

let selectedRating = null;
let pendingLatLng = null;
let roadRatingMode = false;

let roads =
JSON.parse(localStorage.getItem("pennyRoads") || "[]");
  
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

function saveMarker(lat,lng,comment,rating){

const markers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

markers.push({
lat,
lng,
comment,
rating
});

localStorage.setItem(
"pennyMarkers",
JSON.stringify(markers)
);

}

function addMarker(lat,lng,comment,rating){

let color = "blue";

if(rating == 5) color = "green";
if(rating == 4) color = "blue";
if(rating == 3) color = "gold";
if(rating == 2) color = "orange";
if(rating == 1) color = "red";

const icon = L.divIcon({
html: `<div style="
width:18px;
height:18px;
border-radius:50%;
background:${color};
border:2px solid white;
"></div>`,
className: ""
});

const marker = L.marker([lat,lng], {icon})
.addTo(map);

const popupText =
'<div class="popup-box">' +

'<div class="popup-content">' +
comment +
'</div>' +

'<div class="popup-actions">' +
'<button class="delete-marker-btn">🗑️</button>' +
'</div>' +

'</div>';

marker.bindPopup(popupText);

marker.on("popupopen", function(){

const btn =
document.querySelector(".delete-marker-btn");

btn.onclick = function(){

deleteMarker(lat,lng,comment);

};

});

marker.bindPopup(popupText);

marker.on("dblclick", function(){

if(confirm("このピンを削除しますか？")){

map.removeLayer(marker);

let markers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

markers = markers.filter(m =>
!(
m.lat === lat &&
m.lng === lng &&
m.comment === comment
)
);

localStorage.setItem(
"pennyMarkers",
JSON.stringify(markers)
);

}

});

}

function addRoad(points,rating,comment){

let color = "blue";

if(rating == 5) color = "green";
if(rating == 4) color = "blue";
if(rating == 3) color = "gold";
if(rating == 2) color = "orange";
if(rating == 1) color = "red";

const road = L.polyline(
points,
{
color: color,
weight: 14
}
).addTo(map);

const popupText =
'<div class="popup-box">' +

'<div class="popup-content">' +
"★".repeat(rating) +
"<br>" +
comment +
'</div>' +

'<div class="popup-actions">' +
'<button class="delete-road-btn">🗑️</button>' +
'</div>' +

'</div>';

road.bindPopup(popupText);

road.on("popupopen", function(){

const btn =
document.querySelector(".delete-road-btn");

btn.onclick = function(){

deleteRoad(points);

};

});

road.on("dblclick", function(){

if(confirm("この道路を削除しますか？")){

map.removeLayer(road);

roads = roads.filter(r =>
JSON.stringify(r.points) !==
JSON.stringify(points)
);

localStorage.setItem(
"pennyRoads",
JSON.stringify(roads)
);

}

});

}

const savedMarkers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

savedMarkers.forEach(marker => {

addMarker(
marker.lat,
marker.lng,
marker.comment,
marker.rating
);

});

roads.forEach(road => {

addRoad(
road.points,
road.rating,
road.comment
);

});
 
map.on('click', function(e){

if(roadMode){

roadPoints.push([
e.latlng.lat,
e.latlng.lng
]);

if(tempLine){
map.removeLayer(tempLine);
}

tempLine = L.polyline(
roadPoints,
{
color:"blue",
weight:14
}
).addTo(map);

return;
}

if(!pinMode){
return;
}

pendingLatLng = e.latlng;

document.getElementById("ratingPanel")
.style.display = "block";

return;

const comment = prompt(
"路面情報を入力してください"
);

if(!comment) return;

const stars = "★".repeat(Number(rating));

const text =
stars + "<br>" + comment;

addMarker(
e.latlng.lat,
e.latlng.lng,
text,
Number(rating)
);

saveMarker(
e.latlng.lat,
e.latlng.lng,
text,
Number(rating)
);

});

function goToLocation(){

if(!navigator.geolocation){
alert("位置情報が使えません");
return;
}

navigator.geolocation.getCurrentPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

map.setView([lat,lng],17);

L.circleMarker([lat,lng],{
radius:8
}).addTo(map)
.bindPopup("現在地")
.openPopup();

},

()=>{
alert("位置情報の取得に失敗しました");
}

);

}

function toggleRoadMode(){

pinMode = false;
roadMode = true;

updateModeButtons();

if(roadMode){

roadPoints = [];

if(tempLine){
map.removeLayer(tempLine);
tempLine = null;
}

}

}

function finishRoad(){

if(roadPoints.length < 2){
alert("道路を2点以上選んでください");
return;
}

roadRatingMode = true;

document.getElementById("ratingPanel")
.style.display = "block";

return;

if(!comment) return;
  
addRoad(
roadPoints,
Number(rating),
comment
);

roads.push({
points: roadPoints,
rating: Number(rating),
comment: comment
});

localStorage.setItem(
"pennyRoads",
JSON.stringify(roads)
);

if(tempLine){
map.removeLayer(tempLine);
}

roadPoints = [];
tempLine = null;

roadMode = false;

alert("道路を保存しました！");
}

function togglePinMode(){

pinMode = true;
roadMode = false;

updateModeButtons();

}

function toggleMenu(){

menuVisible = !menuVisible;

const panel =
document.getElementById("menuPanel");

if(menuVisible){
panel.style.display = "block";
}else{
panel.style.display = "none";
}

}

function updateModeButtons(){

document.querySelector(".pin-btn")
.classList.remove("active-mode");

document.querySelector(".road-btn")
.classList.remove("active-mode");

if(pinMode){
document.querySelector(".pin-btn")
.classList.add("active-mode");
}

if(roadMode){
document.querySelector(".road-btn")
.classList.add("active-mode");
}

}

function toggleLegend(){

legendVisible = !legendVisible;

const legend =
document.getElementById("legendBox");

if(legendVisible){
legend.style.display = "block";
}else{
legend.style.display = "none";
}

}

function selectRating(rating){

if(roadRatingMode){

document.getElementById("ratingPanel")
.style.display = "none";

const comment = prompt(
"道路コメントを入力してください"
);

if(!comment){
roadRatingMode = false;
return;
}

addRoad(
roadPoints,
rating,
comment
);

roads.push({
points: roadPoints,
rating: rating,
comment: comment
});

localStorage.setItem(
"pennyRoads",
JSON.stringify(roads)
);

if(tempLine){
map.removeLayer(tempLine);
}

roadPoints = [];
tempLine = null;

roadMode = false;
roadRatingMode = false;

updateModeButtons();

alert("道路を保存しました！");

return;
}
  
selectedRating = rating;

document.getElementById("ratingPanel")
.style.display = "none";

const comment = prompt(
"路面情報を入力してください"
);

if(!comment){
return;
}

const stars =
"★".repeat(rating);

const text =
stars + "<br>" + comment;

addMarker(
pendingLatLng.lat,
pendingLatLng.lng,
text,
rating
);

saveMarker(
pendingLatLng.lat,
pendingLatLng.lng,
text,
rating
);

}

function deleteMarker(lat,lng,comment){

if(!confirm("このピンを削除しますか？")){
return;
}

let markers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

markers = markers.filter(m =>
!(
m.lat === lat &&
m.lng === lng &&
m.comment === comment
)
);

localStorage.setItem(
"pennyMarkers",
JSON.stringify(markers)
);

location.reload();

}

function deleteRoad(points){

if(!confirm("この道路を削除しますか？")){
return;
}

roads = roads.filter(r =>
JSON.stringify(r.points) !==
JSON.stringify(points)
);

localStorage.setItem(
"pennyRoads",
JSON.stringify(roads)
);

location.reload();

}

</script>

<div id="ratingPanel" style="
display:none;
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
border-radius:12px;
z-index:2000;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.3);
">

<div style="margin-bottom:10px;">
評価を選んでください
</div>

<div id="starButtons">
<button onclick="selectRating(1)">★☆☆☆☆</button><br><br>
<button onclick="selectRating(2)">★★☆☆☆</button><br><br>
<button onclick="selectRating(3)">★★★☆☆</button><br><br>
<button onclick="selectRating(4)">★★★★☆</button><br><br>
<button onclick="selectRating(5)">★★★★★</button>
</div>

</div>

</body>
</html>
