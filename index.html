<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペニーマップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}

.info {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: white;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
}

.location-btn {
  position: fixed;
  right: 15px;
  bottom: 20px;
  z-index: 1000;
  padding: 12px;
  border: none;
  border-radius: 50%;
  font-size: 20px;
}  

.road-btn {
  position: fixed;
  right: 15px;
  bottom: 80px;
  z-index: 1000;
  padding: 12px;
  border: none;
  border-radius: 50%;
  font-size: 20px;
}

.finish-btn {
  position: fixed;
  right: 15px;
  bottom: 140px;
  z-index: 1000;
  padding: 12px;
  border: none;
  border-radius: 50%;
  font-size: 20px;
}

.delete-btn {
  position: fixed;
  right: 15px;
  bottom: 200px;
  z-index: 1000;
  padding: 12px;
  border: none;
  border-radius: 50%;
  font-size: 20px;
}
  
.legend {
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 1000;
  background: white;
  padding: 8px;
  border-radius: 10px;
  font-size: 12px;
} 

</style>
</head>

<body>

<div class="info">
🛹 ペニーマップ<br>
地図をタップして路面情報を登録
</div>

<div id="map"></div>

<div class="legend">
🟢 ★★★★★ 快適<br>
🔵 ★★★★☆ 良好<br>
🟡 ★★★☆☆ 普通<br>
🟠 ★★☆☆☆ 荒れ気味<br>
🔴 ★☆☆☆☆ 厳しい
</div>

<button class="location-btn" onclick="goToLocation()">
📍
</button>

<button class="road-btn" onclick="toggleRoadMode()">
🛣️
</button>

<button class="finish-btn" onclick="finishRoad()">
✅
</button>

<button class="delete-btn" onclick="toggleDeleteMode()">
🗑️
</button>
  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([31.9111,131.4239], 13);

let roadMode = false;
let roadPoints = [];
let tempLine = null;
let roads =
JSON.parse(localStorage.getItem("pennyRoads") || "[]");
let deleteMode = false;
  
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

function saveMarker(lat,lng,comment,rating){

const markers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

markers.push({
lat,
lng,
comment,
rating
});

localStorage.setItem(
"pennyMarkers",
JSON.stringify(markers)
);

}

function addMarker(lat,lng,comment,rating){

let color = "blue";

if(rating == 5) color = "green";
if(rating == 4) color = "blue";
if(rating == 3) color = "gold";
if(rating == 2) color = "orange";
if(rating == 1) color = "red";

const icon = L.divIcon({
html: `<div style="
width:18px;
height:18px;
border-radius:50%;
background:${color};
border:2px solid white;
"></div>`,
className: ""
});

L.marker([lat,lng], {icon})
.addTo(map)
.bindPopup(comment);

}

function addRoad(points,rating,comment){

let color = "blue";

if(rating == 5) color = "green";
if(rating == 4) color = "blue";
if(rating == 3) color = "gold";
if(rating == 2) color = "orange";
if(rating == 1) color = "red";

const road = L.polyline(
points,
{
color: color,
weight: 6
}
).addTo(map);

road.bindPopup(
"★".repeat(rating) +
"<br>" +
comment
);

road.on("click", function(){

if(!deleteMode){
return;
}

if(confirm("この道路を削除しますか？")){

map.removeLayer(road);

roads = roads.filter(r =>
JSON.stringify(r.points) !==
JSON.stringify(points)
);

localStorage.setItem(
"pennyRoads",
JSON.stringify(roads)
);

}

});

}

const savedMarkers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

savedMarkers.forEach(marker => {

addMarker(
marker.lat,
marker.lng,
marker.comment,
marker.rating
);

});

roads.forEach(road => {

addRoad(
road.points,
road.rating,
road.comment
);

});
 
map.on('click', function(e){

if(roadMode){

roadPoints.push([
e.latlng.lat,
e.latlng.lng
]);

if(tempLine){
map.removeLayer(tempLine);
}

tempLine = L.polyline(
roadPoints,
{
color:"blue",
weight:5
}
).addTo(map);

return;
}
  
const rating = prompt(
"路面評価を入力してください（1〜5）"
);

if(!rating) return;

const comment = prompt(
"路面情報を入力してください"
);

if(!comment) return;

const stars = "★".repeat(Number(rating));

const text =
stars + "<br>" + comment;

addMarker(
e.latlng.lat,
e.latlng.lng,
text,
Number(rating)
);

saveMarker(
e.latlng.lat,
e.latlng.lng,
text,
Number(rating)
);

});

function goToLocation(){

if(!navigator.geolocation){
alert("位置情報が使えません");
return;
}

navigator.geolocation.getCurrentPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

map.setView([lat,lng],17);

L.circleMarker([lat,lng],{
radius:8
}).addTo(map)
.bindPopup("現在地")
.openPopup();

},

()=>{
alert("位置情報の取得に失敗しました");
}

);

}

function toggleRoadMode(){

roadMode = !roadMode;

if(roadMode){

roadPoints = [];

if(tempLine){
map.removeLayer(tempLine);
tempLine = null;
}

alert("道路モード開始！道路に沿ってタップしてください");

}else{

alert("道路モード終了");

}

}

function finishRoad(){

if(roadPoints.length < 2){
alert("道路を2点以上選んでください");
return;
}

const rating = prompt(
"道路評価を入力してください（1〜5）"
);

if(!rating) return;

const comment = prompt(
"道路コメントを入力してください"
);

if(!comment) return;
  
addRoad(
roadPoints,
Number(rating),
comment
);

roads.push({
points: roadPoints,
rating: Number(rating),
comment: comment
});

localStorage.setItem(
"pennyRoads",
JSON.stringify(roads)
);

if(tempLine){
map.removeLayer(tempLine);
}

roadPoints = [];
tempLine = null;

roadMode = false;

alert("道路を保存しました！");
}

function toggleDeleteMode(){

deleteMode = !deleteMode;

if(deleteMode){
alert("削除モードON");
}else{
alert("削除モードOFF");
}

}
  
</script>

</body>
</html>
