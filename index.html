<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペニーマップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}

.info {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: white;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
}

.location-btn {
  position: fixed;
  right: 15px;
  bottom: 20px;
  z-index: 1000;
  padding: 12px;
  border: none;
  border-radius: 50%;
  font-size: 20px;
}  

.road-btn {
  position: fixed;
  right: 15px;
  bottom: 80px;
  z-index: 1000;
  padding: 12px;
  border: none;
  border-radius: 50%;
  font-size: 20px;
}
  
</style>
</head>

<body>

<div class="info">
🛹 ペニーマップ<br>
地図をタップして路面情報を登録
</div>

<div id="map"></div>

<button class="location-btn" onclick="goToLocation()">
📍
</button>

<button class="road-btn" onclick="toggleRoadMode()">
🛣️
</button>
  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([31.9111,131.4239], 13);

let roadMode = false;
let roadPoints = [];
let tempLine = null;
  
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

function saveMarker(lat,lng,comment,rating){

const markers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

markers.push({
lat,
lng,
comment,
rating
});

localStorage.setItem(
"pennyMarkers",
JSON.stringify(markers)
);

}

function addMarker(lat,lng,comment,rating){

let color = "blue";

if(rating == 5) color = "green";
if(rating == 4) color = "blue";
if(rating == 3) color = "gold";
if(rating == 2) color = "orange";
if(rating == 1) color = "red";

const icon = L.divIcon({
html: `<div style="
width:18px;
height:18px;
border-radius:50%;
background:${color};
border:2px solid white;
"></div>`,
className: ""
});

L.marker([lat,lng], {icon})
.addTo(map)
.bindPopup(comment);

}

const savedMarkers =
JSON.parse(localStorage.getItem("pennyMarkers") || "[]");

savedMarkers.forEach(marker => {

addMarker(
marker.lat,
marker.lng,
marker.comment,
marker.rating
);

});

map.on('click', function(e){

if(roadMode){

roadPoints.push([
e.latlng.lat,
e.latlng.lng
]);

if(tempLine){
map.removeLayer(tempLine);
}

tempLine = L.polyline(
roadPoints,
{
color:"blue",
weight:5
}
).addTo(map);

return;
}
  
const rating = prompt(
"路面評価を入力してください（1〜5）"
);

if(!rating) return;

const comment = prompt(
"路面情報を入力してください"
);

if(!comment) return;

const stars = "★".repeat(Number(rating));

const text =
stars + "<br>" + comment;

addMarker(
e.latlng.lat,
e.latlng.lng,
text,
Number(rating)
);

saveMarker(
e.latlng.lat,
e.latlng.lng,
text,
Number(rating)
);

});

function goToLocation(){

if(!navigator.geolocation){
alert("位置情報が使えません");
return;
}

navigator.geolocation.getCurrentPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

map.setView([lat,lng],17);

L.circleMarker([lat,lng],{
radius:8
}).addTo(map)
.bindPopup("現在地")
.openPopup();

},

()=>{
alert("位置情報の取得に失敗しました");
}

);

}

function toggleRoadMode(){

roadMode = !roadMode;

if(roadMode){

roadPoints = [];

if(tempLine){
map.removeLayer(tempLine);
tempLine = null;
}

alert("道路モード開始！道路に沿ってタップしてください");

}else{

alert("道路モード終了");

}

}
  
</script>

</body>
</html>
